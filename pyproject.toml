[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spiced"
version = "0.0.1"
description = "A human-centered AI QA, debugging, testing, and feedback-review companion for indie game developers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lauren Rousell" }]
keywords = ["gamedev", "unity", "qa", "debugging", "ai-assistant"]

dependencies = [
    "PySide6>=6.6",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # Trailer & Screenshot Checklist (Phase G, section 7): local, deterministic
    # resolution/aspect-ratio and blank-shot checks on screenshot images. The
    # first new third-party dependency added since the original AI/PySide6/
    # httpx set — a reasonable, well-established addition rather than hand-
    # rolling image decoding.
    "Pillow>=10.0",
    # Batch Processing & Loudness Normalization (SPICED_IMPLEMENTATION_BIBLE.md,
    # Feature 1): MIT-licensed wrapper around ffmpeg's EBU R128 `loudnorm`
    # filter. Requires the `ffmpeg` binary itself on the host -- a system
    # dependency, not pip-installable -- see docs/loudness_normalize_ffmpeg.md.
    "ffmpeg-normalize>=1.31",
    # Texture & Palette Drift Detection (SPICED_IMPLEMENTATION_BIBLE.md,
    # Feature 4): dominant-color k-means clustering over image pixel arrays.
    # BSD-licensed, the standard array library for exactly this -- scipy is
    # deliberately not added alongside it; k-means (a ~15-line loop) and the
    # Lab/Delta-E color math are hand-rolled on top of plain numpy per the
    # Bible's own documented fallback ("colormath or a hand-rolled Lab
    # conversion"), since colormath is unmaintained upstream.
    "numpy>=1.24",
    # UV Unwrapping + LOD Generation (SPICED_IMPLEMENTATION_BIBLE.md,
    # Feature 8): mesh I/O (OBJ/glTF/GLB only -- FBX has no reliable pure-
    # Python loader, see automation/uv_lod_generation.py), UV unwrapping,
    # and LOD simplification. All three are the exact libraries the Bible
    # names, verified against a real generated mesh in this environment
    # (not merely assumed to work): xatlas.Atlas (chart/utilization stats)
    # and meshoptimizer.simplify (with SIMPLIFY_LOCK_BORDER) both matched
    # their real installed APIs, which differ from the Bible's C++-shaped
    # description in places.
    "trimesh>=4.0",
    "xatlas>=0.0.9",
    "meshoptimizer>=0.2",
    # Localization Audio Sync Checker, Content Verification
    # (SPICED_IMPLEMENTATION_BIBLE.md, Feature 13): self-hosted, fully
    # local speech-to-text -- no audio ever leaves the machine. First run
    # for a given model size downloads and caches it (see
    # docs/faster_whisper_model_caching.md); every run after that is
    # offline. Transcription runs in a subprocess
    # (automation/_stt_worker.py), the same isolation pattern as Feature
    # 8's xatlas worker -- a heavier native/ML dependency shouldn't be
    # able to crash the host process either.
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
# Gemini is optional and no longer the default provider.
gemini = ["google-generativeai>=0.5"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.scripts]
# CLI-first (SPICED_IMPLEMENTATION_BIBLE.md, section 0): every automation
# feature works as a standalone command before any UI panel exists.
spiced-normalize-loudness = "spiced.automation.loudness_normalize:main"
spiced-visual-regression-capture = "spiced.automation.visual_regression_capture:main"
spiced-asset-technical-qa = "spiced.automation.asset_technical_qa:main"
spiced-palette-drift = "spiced.automation.palette_drift:main"
spiced-mix-technical-qa = "spiced.automation.mix_technical_qa:main"
spiced-shader-variant-analysis = "spiced.automation.shader_variant_analysis:main"
spiced-state-machine-retarget-validation = "spiced.automation.state_machine_validation:main"
spiced-uv-lod-generation = "spiced.automation.uv_lod_generation:main"
spiced-gpu-shader-profiling = "spiced.automation.gpu_shader_profiling:main"
spiced-live-animation-bug-detection = "spiced.automation.animation_bug_detection_live:main"
spiced-mocap-cleanup-assist = "spiced.automation.mocap_cleanup_assist:main"
spiced-retopology-assist = "spiced.automation.retopology_assist:main"
spiced-localization-audio-content-check = "spiced.automation.localization_content_verification:main"

[project.gui-scripts]
spiced = "spiced.app.main:main"

[project.urls]
Homepage = "https://github.com/celestewish/spiced-ai"
Repository = "https://github.com/celestewish/spiced-ai"

[tool.setuptools.packages.find]
where = ["src"]

# Bundled Baloo 2 / Nunito font files (Frutiger Aqua theme, ui/theme.py) --
# self-hosted rather than fetched at runtime, since Spiced is an offline-first
# desktop app. See ui/assets/fonts/ for the SIL OFL license texts.
[tool.setuptools.package-data]
spiced = ["ui/assets/fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
