[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spiced-backend"
version = "0.0.1"
description = "Spiced Small-Team Mode backend: FastAPI + SQLAlchemy service for auth, teams, and shared project data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lauren Rousell" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    # Billing Foundation (Market-Viability Roadmap, Phase 5): Stripe
    # Checkout/Billing Portal + webhook signature verification. Test/sandbox
    # keys only -- see app.config.Settings' stripe_* fields.
    "stripe>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# FastAPI's Depends(...) as a parameter default is the framework's own
# dependency-injection idiom, not the mutable-default-argument bug B008
# guards against.
ignore = ["B008"]
