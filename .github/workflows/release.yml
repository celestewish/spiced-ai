name: Build Windows installer

# Connect-a-Project Setup Simplification spec, Finding 3 fix 8: the build
# is a CI job, not a laptop step -- the same "CI does it, not a laptop"
# discipline e2e-tests.yml already established for testing. Triggered on a
# version tag so a release is a deliberate, named act (`git tag v0.1.0 &&
# git push --tags`), not something that fires on every push to main.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-installer:
    # Inno Setup and the PyInstaller build both need a real Windows
    # environment -- unlike e2e-tests.yml's offscreen Qt tests, this can't
    # run on ubuntu-latest.
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Spiced with the build extra
        # "gemini" too, so this build supports the Gemini provider --
        # matches e2e-tests.yml's own reasoning for including it.
        run: pip install -e ".[build,gemini]"

      - name: Write bundled AI provider key(s) from repo secrets (optional)
        # Pre-Alpha Testing spec: bundles a maintainer-supplied default key
        # into this release so a tester gets working AI features with zero
        # setup -- see packaging/vendor/README.md's spend-cap requirement
        # before ever configuring these secrets (Settings -> Secrets and
        # variables -> Actions on this repo). Each one is skipped entirely
        # if its secret isn't set, matching spiced.spec's own "quietly
        # absent" handling for the resulting file -- a release built
        # without either behaves like a source checkout for that provider
        # (a tester needs their own key, or uses MockProvider). Values come
        # in via env:, not interpolated directly into the script, per
        # GitHub's own guidance for handling secrets in a run: step.
        shell: pwsh
        env:
          BUNDLED_OPENAI_API_KEY: ${{ secrets.BUNDLED_OPENAI_API_KEY }}
          BUNDLED_GEMINI_API_KEY: ${{ secrets.BUNDLED_GEMINI_API_KEY }}
        run: |
          New-Item -ItemType Directory -Force -Path packaging/vendor | Out-Null
          if ($env:BUNDLED_OPENAI_API_KEY) {
            Set-Content -Path packaging/vendor/bundled_openai_key.txt -Value $env:BUNDLED_OPENAI_API_KEY -NoNewline
          }
          if ($env:BUNDLED_GEMINI_API_KEY) {
            Set-Content -Path packaging/vendor/bundled_gemini_key.txt -Value $env:BUNDLED_GEMINI_API_KEY -NoNewline
          }

      - name: Build the PyInstaller onedir bundle
        # The real shipped shape: windowed (console=False, spiced.spec's
        # own default). See packaging/README.md's "Known issue" section
        # for how SPICED_DEBUG_CONSOLE=1 was used to root-cause and confirm
        # the fix for the windowed build's sys.stdout/stderr being None
        # (spiced.app.main._ensure_std_streams) -- not needed here anymore
        # now that that's fixed at the source instead of worked around.
        run: pyinstaller packaging/spiced.spec

      - name: Smoke-test the built exe
        # Constructs the real app (Services, MainWindow, every screen)
        # against the *built* exe and exits without opening a real window
        # -- catches a missing-DLL/missing-font/missing-FFMPEG_PATH
        # bundling gap here, before a user hits it. See packaging/README.md.
        # Start-Process -Wait -PassThru, not a bare `&` call with stream
        # redirection: for a windowed-subsystem (console=False) exe,
        # PowerShell's own process-wait/$LASTEXITCODE tracking around a
        # directly-redirected `&` invocation turned out to be unreliable
        # (an empty $LASTEXITCODE, not 0 or 1, observed while diagnosing
        # this very step) -- Start-Process is the documented, reliable way
        # to launch *and wait for* a native process and get its real exit
        # code regardless of subsystem.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $proc = Start-Process -FilePath "dist\Spiced\Spiced.exe" -ArgumentList "--smoke-test" `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput smoke_test_stdout.txt -RedirectStandardError smoke_test_stderr.txt
          $code = $proc.ExitCode
          Write-Host "--- smoke test stdout ---"
          Get-Content smoke_test_stdout.txt -ErrorAction SilentlyContinue
          Write-Host "--- smoke test stderr ---"
          Get-Content smoke_test_stderr.txt -ErrorAction SilentlyContinue
          Write-Host "--- exit code: $code ---"
          if ($code -ne 0) {
            Write-Error "Smoke test failed with exit code $code"
            exit 1
          }

      - name: Dump crash diagnostics on smoke-test failure
        # packaging/README.md documents an unresolved, silent (no Python
        # traceback -- the exe's own stdout never appears) crash inside
        # Qt6Core.dll. A native fault like that shows up in Windows'
        # Application event log with the real faulting module/exception
        # code, which is a lot more actionable than guessing at a fix
        # blind. Runs only when the previous step actually failed.
        if: failure()
        shell: pwsh
        run: |
          Write-Host "--- Application error events (most recent first) ---"
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 5 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Message
          Write-Host "--- .NET/native crash (Id 1001, WER) events ---"
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1001} -MaxEvents 5 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Message
          Write-Host "--- dist\Spiced contents (sanity check nothing's missing) ---"
          Get-ChildItem -Recurse dist\Spiced | Select-Object -First 200 FullName

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        # No vendored ffmpeg.exe in CI (packaging/vendor/README.md's
        # download step is a manual, license-reviewed action a maintainer
        # takes locally, not automated here) -- spiced.spec and
        # inno_setup.iss both already degrade cleanly without one, so this
        # CI-built installer behaves like a source checkout for loudness
        # normalization until that's wired up separately.
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" packaging\inno_setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spiced-Setup
          path: packaging/output/Spiced-Setup.exe
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/output/Spiced-Setup.exe
          generate_release_notes: true
